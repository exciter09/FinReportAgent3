[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-report-agent"
version = "0.1.0"
description = "Teaching-oriented Agentic RAG assistant for US 10-K/10-Q filing analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=2.0.0,<3.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
retrieval = [
    "lancedb>=0.17.0",
    "pyarrow>=16.0.0",
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
fin-report-agent = "fin_report_agent.main:main"
fin-report-agent-eval = "fin_report_agent.eval.runner:main"

[tool.setuptools.packages.find]
include = ["fin_report_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "mcp/edgar-mcp-server/tests"]
pythonpath = [".", "mcp/edgar-mcp-server/src"]
